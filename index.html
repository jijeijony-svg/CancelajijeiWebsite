<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>site</title>

<script>
/* ============================================================
   EDIT ME — your links
   ============================================================ */
const CONFIG = {
  links: {
    bio: "bio.html",
    soundcloud: "https://soundcloud.com/cancela25",
    residentAdvisor: "https://ra.co/dj/cancela",
    contactEmail: "jijeijony@gmail.com",
  },

  /* ============================================================
     EDIT ME — background images
     ============================================================ */
  images: [
    "images/image00001.jpeg",
    "images/image00002.jpeg",
    "images/image00003.jpeg",
    "images/image00004.jpeg",
    "images/image00005.jpeg",
    "images/image00006.jpeg",
    "images/image00007.jpeg",
    "images/image00008.jpeg",
    "images/image00009.jpeg",
    "images/image00010.jpeg",
    "images/image00011.jpeg",
    "images/image00012.jpeg",
    "images/image00013.jpeg",
    "images/image00014.jpeg",
    "images/image00015.jpeg",
  ],

  /* ============================================================
     EDIT ME — latest media list
     text = what visitors see, url = where it goes
     ============================================================ */
  latestMedia: [
    { text: "Soundcloud Mix for Colectivo56", url: "https://soundcloud.com/coletivo56/cancela?in=cancela25/sets/mixed-by-me" },
    { text: "Collect Lisbon Mix", url: "https://youtu.be/OGpWWLZOSk4" },
  ],

  /* ============================================================
     EDIT ME — pencil effect
     enabled: true/false to switch the drawing on or off
     colors: each new stroke picks one of these at random
     width: line thickness in pixels
     ============================================================ */
  pencil: {
    enabled: true,
    colors: ["#000000", "#6b4423", "#ffffff"],   // black, brown, white
    width: 2.5,
  },
};
</script>

<style>
  :root{
    --ink: #f2efe9;
    --ink-dim: rgba(242,239,233,0.62);
    --scrim-top: rgba(8,8,9,0.15);
    --scrim-bottom: rgba(8,8,9,0.65);
    --line: rgba(242,239,233,0.4);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: #0c0c0d;
  }

  body{
    font-family: 'Space Mono', 'Courier New', monospace;
    color: var(--ink);
    overflow: hidden;
  }

  #bg-layer{
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #0c0c0d;
  }

  #bg-layer img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: fade-in 1.8s ease forwards, kenburns 40s ease-out forwards;
  }

  @keyframes fade-in{
    to{ opacity: 1; }
  }

  @keyframes kenburns{
    from{ transform: scale(1.06); }
    to{ transform: scale(1); }
  }

  #bg-layer::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--scrim-top) 0%, var(--scrim-bottom) 100%);
  }

  main{
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(24px, 6vw, 72px);
  }

  nav{
    display: flex;
    flex-direction: column;
    gap: 0.65em;
    width: max-content;
  }

  nav a{
    color: var(--ink);
    text-decoration: none;
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
    text-transform: lowercase;
    letter-spacing: 0.02em;
    position: relative;
    padding-bottom: 2px;
    width: max-content;
  }

  nav a::after{
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--line);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.35s ease;
  }

  nav a:hover::after,
  nav a:focus-visible::after{
    transform: scaleX(1);
  }

  nav a:focus-visible{
    outline: 1px dashed var(--ink);
    outline-offset: 4px;
  }

  footer{
    margin-top: 1.6em;
    font-size: 0.6rem;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  /* pencil drawing layer: sits above the photo, below the links */
  #pencil-layer{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* latest media list */
  #latest-media{ margin-top: 0.4em; }

  .media-title{
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
    text-transform: lowercase;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }

  #media-list{
    list-style: none;
    margin: 0.5em 0 0;
    padding-left: 1em;
    display: flex;
    flex-direction: column;
    gap: 0.4em;
  }

  #media-list a{ font-size: clamp(0.9rem, 2vw, 1.1rem); }

  @media (prefers-reduced-motion: reduce){
    #bg-layer img{
      animation: fade-in 0.6s ease forwards;
    }
  }
</style>
</head>
<body>

<div id="bg-layer"></div>
<canvas id="pencil-layer"></canvas>

<main>
  <nav>
    <a id="link-bio" href="#">bio</a>
    <a id="link-soundcloud" href="#" target="_blank" rel="noopener">soundcloud</a>
    <a id="link-ra" href="#" target="_blank" rel="noopener">resident advisor</a>
    <div id="latest-media">
      <span class="media-title">latest media</span>
      <ul id="media-list"></ul>
    </div>
    <a id="link-contact" href="#">contact</a>
  </nav>
  <footer>Cancela</footer>
</main>

<script>
  // wire up links from CONFIG
  document.getElementById('link-bio').href = CONFIG.links.bio;
  document.getElementById('link-soundcloud').href = CONFIG.links.soundcloud;
  document.getElementById('link-ra').href = CONFIG.links.residentAdvisor;
  document.getElementById('link-contact').href = 'mailto:' + CONFIG.links.contactEmail;

  // build the latest media list
  const mediaList = document.getElementById('media-list');
  if (CONFIG.latestMedia && CONFIG.latestMedia.length > 0){
    CONFIG.latestMedia.forEach(item => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = item.url;
      a.textContent = item.text;
      a.target = '_blank';
      a.rel = 'noopener';
      li.appendChild(a);
      mediaList.appendChild(li);
    });
  } else {
    document.getElementById('latest-media').style.display = 'none';
  }

  // pick one random background image per page load
  const bgLayer = document.getElementById('bg-layer');
  if (CONFIG.images && CONFIG.images.length > 0){
    const choice = CONFIG.images[Math.floor(Math.random() * CONFIG.images.length)];
    const img = document.createElement('img');
    img.src = choice;
    img.alt = "";
    bgLayer.appendChild(img);
  }

  // pencil effect: the cursor leaves a line as it moves
  (function(){
    const P = CONFIG.pencil;
    const canvas = document.getElementById('pencil-layer');
    if (!P || !P.enabled){ canvas.style.display = 'none'; return; }

    const ctx = canvas.getContext('2d');
    let dpr = window.devicePixelRatio || 1;

    function resize(){
      // keep what has already been drawn when the window size changes
      const keep = document.createElement('canvas');
      keep.width = canvas.width;
      keep.height = canvas.height;
      keep.getContext('2d').drawImage(canvas, 0, 0);

      dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.drawImage(keep, 0, 0, keep.width / dpr, keep.height / dpr);
    }
    resize();
    window.addEventListener('resize', resize);

    let last = null;
    let lastTime = 0;
    let color = P.colors[0];

    function newStroke(){
      color = P.colors[Math.floor(Math.random() * P.colors.length)];
    }
    newStroke();

    window.addEventListener('pointermove', e => {
      const now = performance.now();
      // a pause in movement starts a new stroke with a new color
      if (last && now - lastTime > 600){ last = null; newStroke(); }

      if (last){
        // slightly thinner when moving fast, like real pencil pressure
        const dist = Math.hypot(e.clientX - last.x, e.clientY - last.y);
        const w = P.width * Math.max(0.6, 1.2 - dist / 80);
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(e.clientX, e.clientY);
        ctx.stroke();
      }
      last = { x: e.clientX, y: e.clientY };
      lastTime = now;
    });

    // leaving the window lifts the pencil
    document.addEventListener('pointerleave', () => { last = null; newStroke(); });
    window.addEventListener('blur', () => { last = null; });
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

</body>
</html>
